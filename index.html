<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأسعار - محمود</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-top: 20px; }
        .btn-custom { width: 100%; margin-bottom: 10px; padding: 15px; font-size: 1.1rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="container text-center">
    <div class="card p-4">
        <h2 class="mb-4 text-primary">لوحة تحكم POS</h2>
        <hr>
        
        <h5 class="mb-3">قيمة الخصم (val)</h5>
        <button class="btn btn-danger btn-custom" onclick="updatePrice('val', 0)">تصفير الخصم (0)</button>
        <button class="btn btn-warning btn-custom" onclick="updatePrice('val', 0.6)">تفعيل خصم 40% (0.6)</button>
        <button class="btn btn-success btn-custom" onclick="updatePrice('val', 1)">السعر كامل (1.0)</button>
        
        <hr>
        
        <h5 class="mb-3">القيمة الثانية (val2)</h5>
        <button class="btn btn-outline-danger btn-custom" onclick="updatePrice('val2', 0)">تصفير القيمة (0)</button>
        <button class="btn btn-outline-success btn-custom" onclick="updatePrice('val2', 1)">القيمة كاملة (1.0)</button>
    </div>
    
    <div id="status" class="mt-3 text-muted"></div>
</div>

<script>
    // ضع رابط السكربت الخاص بك هنا
    const scriptUrl = "https://script.google.com/macros/s/AKfycbzu42wjal5fTgG5bJ1yqLCXva8yFt9gaFzmua1Pa5BSRc-wiFpGW4-hRnS1zcM4F8kaMg/exec";

    function updatePrice(param, value) {
        const statusDiv = document.getElementById('status');
        statusDiv.innerText = "جاري التحديث...";
        
        // نفتح السكربت في خلفية الصفحة (iframe مخفي أو fetch)
        fetch(`${scriptUrl}?${param}=${value}`, { mode: 'no-cors' })
        .then(() => {
            statusDiv.innerHTML = `<span class="text-success">تم تحديث ${param} إلى ${value} بنجاح ✅</span>`;
        })
        .catch(err => {
            statusDiv.innerHTML = `<span class="text-danger">حدث خطأ في الاتصال ❌</span>`;
        });
    }
</script>

</body>
</html>
